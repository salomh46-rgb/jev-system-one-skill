[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-system-one"
version = "1.0.0"
description = "Sub-100ms non-autoregressive decision engine and Agent Skill powered by TypeSafe AI's Jev (System One)"
readme = "README.md"
authors = [
  { name = "Javohirbek Asqarov (Jasper)", email = "jasper@typesafe-community.dev" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
]

[project.urls]
"Homepage" = "https://github.com/salomh46-rgb/jev-system-one-skill"
"Bug Tracker" = "https://github.com/salomh46-rgb/jev-system-one-skill/issues"
